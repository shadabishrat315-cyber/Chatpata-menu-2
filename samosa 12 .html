<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatpata Samosa & Chai</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #FFD700;
      font-family: "Poppins", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-top: 30px;
      letter-spacing: 2px;
    }

    .menu {
      margin: 40px auto;
      width: 80%;
      max-width: 400px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #FFD700;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 1.1em;
      border-bottom: 1px solid #FFD70033;
      padding-bottom: 5px;
    }

    .game {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 215, 0, 0.1);
      border-radius: 15px;
      width: 80%;
      max-width: 400px;
      border: 1px solid #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      margin-left: auto;
      margin-right: auto;
    }

    .tagline {
      margin-top: 15px;
      font-style: italic;
      font-size: 1em;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9em;
      color: #bdbdbd;
    }
  </style>
</head>
<body>
  <h1>☕ Chatpata Samosa & Chai 🍴</h1>

  <div class="menu">
    <div class="item"><span>Tea</span><span>₹10</span></div>
    <div class="item"><span>Coffee</span><span>₹15</span></div>
    <div class="item"><span>Samosa (1 piece)</span><span>₹12</span></div>
    <div class="item"><span>Samosa Chaat</span><span>₹25</span></div>
    <div class="item"><span>Dahi Batasha (5 pieces)</span><span>₹15</span></div>
  </div>

  <div class="game">
    <h2>🎮 Wire Loop Challenge ⚡</h2>
    <p class="tagline">Apni steady hand se jeeto mazedaar prize!</p>
  </div>

  <footer>
    © 2025 Chatpata Samosa & Chai | Taste that wins hearts 💛
  </footer>
</body>
</html>
